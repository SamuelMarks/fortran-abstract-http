repos:
  - repo: local
    hooks:
      - id: fah-clang-format
        name: ISO C89 clang-format check
        entry: sh -c "find include src tests generated -maxdepth 3 \( -name '*.c' -o -name '*.h' \) -exec clang-format --dry-run --Werror --style=LLVM {} +"
        language: system
        pass_filenames: false
      - id: fah-dialect-lint
        name: 12-era FORTRAN/Fortran dialect lint
        entry: python3 tools/fah_dialect_lint.py --check-all
        language: system
        pass_filenames: false
      - id: fah-doc-check
        name: 100% C & Fortran documentation coverage check
        entry: sh -c "mkdir -p docs/doxygen && doxygen Doxyfile && python3 tools/fah_doc_check.py --check-all"
        language: system
        pass_filenames: false
      - id: fah-panic-lint
        name: Zero-panic & unified error enum check
        entry: python3 tools/fah_lint.py --check-all
        language: system
        pass_filenames: false
